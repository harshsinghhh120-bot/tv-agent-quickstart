[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-agent-quickstart"
version = "0.1.0"
description = "Scaffold an AI companion agent for TV apps in ~10 minutes (Strands + Bedrock + AgentCore)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ReelMind Hackathon Team" }]
keywords = ["tv", "fire-tv", "agent", "bedrock", "strands", "amazon", "companion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.5",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34", "strands-agents>=0.1"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
agentcore = ["agentcore>=0.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tv_agent_kit*"]
